name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  solana:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: |
          (cd solana && npm ci --no-audit --no-fund)
          (cd solana/devnet-demo && npm ci --no-audit --no-fund)
          (cd solana/policy && npm ci --no-audit --no-fund)
      - name: Syntax
        run: for f in $(git ls-files "solana/*.mjs"); do node --check "$f"; done
      - name: Pre-sign policy (38 tests, no network)
        working-directory: solana/policy
        run: npm test
      - name: Verifier against real transactions (21 cases, public RPC)
        working-directory: solana
        run: node test-live.mjs

