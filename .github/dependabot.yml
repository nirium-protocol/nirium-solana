version: 2
updates:
  - package-ecosystem: npm
    directory: "/solana"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      x402-and-solana-evm:
        patterns: ["@x402/*", "@solana/*", "viem"]
  - package-ecosystem: npm
    directory: "/solana/market"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      x402-and-solana-evm:
        patterns: ["@x402/*", "@solana/*", "viem"]
  - package-ecosystem: npm
    directory: "/solana/devnet-demo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      x402-and-solana-evm:
        patterns: ["@x402/*", "@solana/*", "viem"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
